 var tl=$('#tl');tl.innerHTML=tiles.map(function(c,i){return '<button style="--j:'+i+'"'+(ans.indexOf(i)>-1?' disabled':'')+'>'+c+'</button>'}).join('');
 $$('#tl button').forEach(function(b,i){b.onclick=function(){wTap(i)}})}
function wTap(i){if(wBusy||ans.indexOf(i)>-1||ans.length>=word.length)return;ans.push(i);wR();if(ans.length===word.length)wCheck()}
function wCheck(){var g=ans.map(function(i){return tiles[i]}).join('');wBusy=true;
 if(g===word){$('#wm').textContent=L>=1000?'You finished all 1000 levels! 🏆':'Great job! 🎉';wR('ok');if(L<1000)sv('lvl',L+1);else sv('lvl',1000);setTimeout(function(){if(L<1000)wInit();else wBusy=true},1300)}
 else{$('#wm').textContent='Not quite. Try again!';wR('no');setTimeout(function(){ans=remap(word.slice(0,locked).split(''));wBusy=false;$('#wm').textContent='Unscramble the word!';wR()},550)}}
function wBack(){if(wBusy||ans.length<=locked)return;ans.pop();wR()}
$('#wb').onclick=wBack;
$('#wh').onclick=function(){if(wBusy||left<1||stage>=3)return;if(stage>=1&&locked>=word.length-1)return;left--;sv('hu',3-left);stage++;if(stage>1){locked++;ans=remap(word.slice(0,locked).split(''))}wR()};
$('#ws').onclick=function(){if(wBusy)return;var l=ans.map(function(i){return tiles[i]});tiles=shuf(tiles,Math.random);ans=remap(l);wR()};
addEventListener('keydown',function(e){var k=e.key;if(!$('#w').classList.contains('on'))return;if(k==='Backspace')wBack();else if(/^[a-z]$/i.test(k)){var c=k.toUpperCase(),j=tiles.findIndex(function(t,x){return t===c&&ans.indexOf(x)<0});if(j>-1)wTap(j)}});
wInit();

try{var ic='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#5b4bff"/><text x="32" y="43" font-size="30" text-anchor="middle" fill="#ffd23f" font-family="Arial" font-weight="900">AB</text></svg>');
$('#mf').href=URL.createObjectURL(new Blob([JSON.stringify({name:'Word Scramble',short_name:'Scramble',start_url:location.href.split('#')[0],display:'standalone',background_color:'#efeaff',theme_color:'#5b4bff',icons:[{src:ic,sizes:'any',type:'image/svg+xml'}]})],{type:'application/manifest+json'}))}catch(e){}
})();
</script></body></html>
